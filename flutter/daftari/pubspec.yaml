name: daftari
description: "A ledger that cannot be lost."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Localisation and formatting
  flutter_localizations:
    sdk: flutter
  # Pinned to match flutter_localizations' own transitive requirement —
  # `flutter pub get` fails otherwise with a version-solving conflict,
  # since the Flutter SDK's flutter_localizations package hard-pins intl
  # to whatever version ships with the current stable channel.
  intl: ^0.20.2

  # Local database — the source of truth
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Capture — on-device speech recognition, so a live transcript appears
  # while the user is still speaking and works with no network (Rule #2).
  # `record` is kept for a future raw-audio-file capture path (see
  # LIMITATIONS.md — Origin screen's "play recording" control has no audio
  # to play in this build, since simultaneous speech_to_text + raw
  # recording is not reliably supported across platforms yet).
  speech_to_text: ^7.0.0
  record: ^5.1.2
  permission_handler: ^11.3.1

  # Sync
  connectivity_plus: ^6.0.5
  # Networking is not yet wired to a backend — DAFTARI works entirely
  # offline today (Rule #2). `dio` (or `http`) is the natural choice when
  # `agents/sikio` and `agents/daftari` get a real client; see
  # LIMITATIONS.md for that as a documented next step.
  uuid: ^4.5.1

  # Settings
  shared_preferences: ^2.3.2
  package_info_plus: ^8.1.1

  # State management and navigation
  provider: ^6.1.2
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # Generates lib/l10n/app_localizations.dart from the ARB files.
  generate: true

  assets:
    - assets/brand/

# One source image produces every launcher size, for Android and web.
flutter_launcher_icons:
  android: true

  # The launcher source is the second logo: the mark already on its field.
  image_path: "assets/brand/icon.png"

  # Adaptive icons supply the field themselves, so the foreground must be the
  # bare mark. The navy square here would nest one field inside another.
  adaptive_icon_background: "#0B1B2B"
  adaptive_icon_foreground: "assets/brand/logo.png"

  web:
    generate: true
    image_path: "assets/brand/icon.png"
    background_color: "#0B1B2B"
    theme_color: "#0B1B2B"
